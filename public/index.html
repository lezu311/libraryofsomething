<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="client.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <p class="name">Library of something</p>
            <p class="short-description">Why am i here</p>
        </div>
    </header>

    <section class="featured">
        <h2>Take a look at the featured books</h2>
        <div class="featured-list">
            <div class="featured-card">
                <div class="cover-placeholder"></div>
                <p class="title">Book Title One</p>
            </div>
                <div class="featured-card">
                <div class="cover-placeholder"></div>
                <p class="title">Book Title Two</p>
            </div>
            <div class="featured-card">
                <div class="cover-placeholder"></div>
                <p class="title">Book Title Three</p>
            </div>
        </div>
    </section>

    <h2 style="margin: 15px;">Or...</h2>

    <section class="search">
        <h2>Search for one!</h2>

        <div class="search-layout">
            <div class="category-tree">
                <div class="category-tree-scroll">
                    <details>
                        <summary><button class="category-button">A</button></summary>
                        <ul>
                            <li>
                                <details>
                                    <summary><button class="category-button">AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA</button></summary>
                                    <ul>
                                        <li class="leaf"><button class="category-button">AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA</button></li>
                                        <li class="leaf"><button class="category-button">A</button></li>
                                    </ul>
                                </details>
                            </li>
                            <li>
                                <details>
                                    <summary><button class="category-button">A</button></summary>
                                    <ul>
                                        <li class="leaf"><button class="category-button">A</button></li>
                                        <li class="leaf"><button class="category-button">A</button></li>
                                    </ul>
                                </details>
                            </li>
                        </ul>
                    </details>
                </div>
            </div>

            <div class="results-container">
                <input type="text" class="search-bar" placeholder="Search by title...">
            
                <div class="search-results">
                    <div class="search-result">
                        <div class="cover-placeholder"></div>
                        <p class="title">Search Result One</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

  <main class="main-content">
    
  </main>
</body>
</html>
