<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - BookShare</title>
    <link rel="stylesheet" href="../bookview/style.css">
    <link rel="stylesheet" href="nhansach.css">
    <script src="nhansach.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <div class="image">
                <img class="logo1" src="../bookview/logoTHCSQN.png" alt="THCS quang ninh">
                <p class="logoname"> THCS Quảng Ninh</p>
            </div>
        </div>
        <div class="desc">
            <p class="name">BookShare - Sách truyền tay</p>
            <p class="short-description">Bộ sách kết nối tri thức và cuộc sống</p>
        </div>
    </header>

    <section class="book-view">
        <div class="mail">

            <!-- menu bên trái -->
            <aside class="mail-side">
                <div class="mail-brand">
                    <span data-icon="mail"></span>
                    <span>Thông báo</span>
                </div>

                <nav class="mail-tabs">
                    <button type="button" id="tab-inbox" class="mail-tab active">
                        <span data-icon="inbox"></span>
                        <span class="mail-tab-label">Hộp thư đến</span>
                        <span id="count-inbox" class="mail-count" hidden></span>
                    </button>
                    <button type="button" id="tab-sent" class="mail-tab">
                        <span data-icon="send"></span>
                        <span class="mail-tab-label">Đã gửi</span>
                        <span id="count-sent" class="mail-count" hidden></span>
                    </button>
                </nav>

                <a class="mail-home" href="/index.html">
                    <span data-icon="home"></span>
                    <span>Trang chủ</span>
                </a>
            </aside>

            <!-- khung chính -->
            <main class="mail-main">
                <div id="mail-toolbar" class="mail-toolbar">
                    <h2 id="mail-title">Hộp thư đến</h2>
                    <button type="button" id="mail-refresh" class="icon-btn" title="Tải lại" aria-label="Tải lại">
                        <span data-icon="refresh"></span>
                    </button>
                </div>

                <div id="mail-list" class="mail-list">Đang tải...</div>
                <article id="mail-detail" class="mail-detail" hidden></article>
            </main>

        </div>
    </section>
</body>
</html>
