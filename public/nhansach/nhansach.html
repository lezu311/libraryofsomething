<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - BookShare</title>
    <link rel="stylesheet" href="../bookview/style.css">
    <link rel="stylesheet" href="nhansach.css">
    <script src="nhansach.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <div class="image">
                <img class="logo1" src="../bookview/logoTHCSQN.png" alt="THCS quang ninh">
                <p class="logoname"> THCS Quảng Ninh</p>
            </div>
        </div>
        <div class="desc">
            <p class="name">BookShare - Sách truyền tay</p>
            <p class="short-description">Bộ sách kết nối tri thức và cuộc sống</p>
        </div>
    </header>

    <section class="book-view">
        <div class="notify-wrap">
            <a class="back-home" href="/index.html">← Về trang chủ</a>

            <h2 class="notify-heading">🔔 Thông báo</h2>

            <h3 class="notify-section">Người muốn nhận sách của bạn</h3>
            <p class="hint">Bấm <b>Đồng ý</b> thì sách sẽ bị xoá khỏi web. Hãy liên lạc với người nhận qua thông tin họ để lại.</p>
            <div id="incoming-list" class="notify-list">Đang tải...</div>

            <h3 class="notify-section">Sách bạn đã xin nhận</h3>
            <div id="outgoing-list" class="notify-list">Đang tải...</div>
        </div>
    </section>
</body>
</html>
